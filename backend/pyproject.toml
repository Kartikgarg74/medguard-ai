[project]
name = "medguard-ai"
version = "0.1.0"
description = "Multi-Agent Medicine Price Compliance System under DPCO 2013"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
