name: MedGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check backend/src/ --output-format=github
      - run: ruff format --check backend/src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          MEDGUARD_ENCRYPTION_KEY: test-encryption-key-for-ci
          DATABASE_PATH: ":memory:"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt || true
      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "sk_live_\|gsk_[a-zA-Z0-9]\{20,\}\|AKIA[A-Z0-9]" backend/src/ || echo "WARNING: Potential secrets found"
